[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trans"
version = "0.1.0"
description = "i18n translation engine powered by Claude Code + Skills"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "claude-agent-sdk",
]

[project.scripts]
trans = "trans.cli:cli"

[tool.setuptools.packages.find]
include = ["trans*"]
